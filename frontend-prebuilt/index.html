<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IICTD Process Automation System (IPAS)</title>
    <script type="module" crossorigin src="/assets/index-CqUtqHf-v2.js?v=pdf-export-available-20260618"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CiIE_XXt.css">
    <link rel="stylesheet" crossorigin href="/assets/ipas-responsive.css">
    <link rel="stylesheet" href="/assets/ipas-cam.css">
    <link rel="stylesheet" href="/assets/ipas-ter-recorder.css">
    <script defer src="/assets/ipas-responsive.js"></script>
    <script defer src="/assets/ipas-cam.js?v=20261019-fast1"></script>
    <script defer src="/assets/ipas-ter-recorder.js"></script>
    <script defer src="/assets/ipas-smart-capture-camera.js?v=20261019-fast1"></script>
    <style>
      #ipas-season-canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
        display: none;
      }
      .ipas-lights-wire {
        position: fixed;
        top: 18px; left: 0;
        width: 100%; height: 2px;
        background: #333;
        z-index: 9999;
        display: none;
      }
      .ipas-lights-row {
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        display: none;
        justify-content: space-around;
        padding: 0 10px;
        z-index: 9999;
      }
      .ipas-bulb {
        width: 12px; height: 18px;
        border-radius: 50% 50% 45% 45%;
        margin-top: 8px;
        animation: ipas-glow 1.5s ease-in-out infinite alternate;
      }
      .ipas-bulb:nth-child(4n+1){background:#ff3333;box-shadow:0 0 10px #ff0000;animation-delay:0s;}
      .ipas-bulb:nth-child(4n+2){background:#33cc33;box-shadow:0 0 10px #00cc00;animation-delay:0.4s;}
      .ipas-bulb:nth-child(4n+3){background:#ffcc00;box-shadow:0 0 10px #ffaa00;animation-delay:0.8s;}
      .ipas-bulb:nth-child(4n+0){background:#3399ff;box-shadow:0 0 10px #0077ff;animation-delay:1.2s;}
      @keyframes ipas-glow {
        from { opacity:0.5; }
        to   { opacity:1; filter:brightness(1.4); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <canvas id="ipas-season-canvas"></canvas>
    <div class="ipas-lights-wire" id="ipas-wire"></div>
    <div class="ipas-lights-row" id="ipas-lights"></div>

    <script>
    (function(){
      function getEaster(y){
        var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4;
        var f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
        var h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
        var l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
        var mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;
        return new Date(y,mo-1,dy);
      }
      function getSeason(){
        var now=new Date(),y=now.getFullYear(),mo=now.getMonth()+1,d=now.getDate();
        var doy=Math.floor((now-new Date(y,0,0))/86400000);
        var easter=getEaster(y);
        var edoy=Math.floor((easter-new Date(y,0,0))/86400000);
        if(mo===12&&d===31)                return 'newyear_eve';
        if(mo===1&&d<=15)                  return 'newyear';
        if(mo===1&&d>=16)                  return 'dinagyang';
        if(mo===2&&d<=14)                  return 'valentine';
        if(doy>=edoy-3&&doy<=edoy)         return 'holyweek';
        if((mo===3&&d>=15)||mo===4||mo===5) return 'summer';
        if(mo>=6&&mo<=8)                   return 'rainy';
        if(mo===9)                         return 'ber_months';
        if(mo===10&&d===31)                return 'halloween';
        if(mo===10)                        return 'halloween_season';
        if(mo===11&&d<=2)                  return 'undas';
        if(mo===11)                        return 'christmas_prep';
        if(mo===12)                        return 'christmas';
        return 'christmas';
      }
      var SEASONS={
        newyear_eve:     {bg:'linear-gradient(160deg,#000010,#0a0a2a)',lights:false,fx:'fireworks'},
        newyear:         {bg:'linear-gradient(160deg,#000015,#0a0a30)',lights:false,fx:'fireworks'},
        dinagyang:       {bg:'linear-gradient(160deg,#1a0500,#2d0a00,#1a0020)',lights:false,fx:'confetti'},
        valentine:       {bg:'linear-gradient(160deg,#1a0010,#2d0020,#1a000a)',lights:false,fx:'hearts'},
        holyweek:        {bg:'linear-gradient(160deg,#0d0010,#150020,#0d000d)',lights:false,fx:'candles'},
        summer:          {bg:'linear-gradient(160deg,#1a0800,#2d1500,#1a0500)',lights:false,fx:'sunrays'},
        rainy:           {bg:'linear-gradient(160deg,#050d1a,#0a1525,#050d1a)',lights:false,fx:'rain'},
        ber_months:      {bg:'linear-gradient(160deg,#001a05,#002d0a,#001a10)',lights:true, fx:'snow_light'},
        halloween_season:{bg:'linear-gradient(160deg,#0d0500,#1a0a00,#0d0000)',lights:false,fx:'bats'},
        halloween:       {bg:'linear-gradient(160deg,#0a0000,#150500,#0a0000)',lights:false,fx:'bats'},
        undas:           {bg:'linear-gradient(160deg,#0a000d,#150015,#0a000d)',lights:false,fx:'candles'},
        christmas_prep:  {bg:'linear-gradient(160deg,#0a1a00,#001a0a,#1a0000)',lights:true, fx:'snow_light'},
        christmas:       {bg:'linear-gradient(160deg,#0a1628,#0d2b1a,#1a0a0a)',lights:true, fx:'snow'}
      };

      var season=getSeason();
      var cfg=SEASONS[season];
      var canvas=document.getElementById('ipas-season-canvas');
      var ctx=canvas.getContext('2d');
      var active=false;
      var particles=[];
      var animId=null;
      var FX_COLORS={
        fireworks:[[255,215,0],[255,102,0],[255,0,102],[0,204,255],[255,255,255]],
        confetti:[[255,51,0],[255,153,0],[255,204,0],[0,204,68],[51,153,255],[204,0,255],[255,0,102]]
      };

      function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
      window.addEventListener('resize',resize);

      function initParticles(){
        resize();
        particles=[];
        var fx=cfg.fx,n=fx==='rain'?200:fx==='bats'?30:120;
        for(var i=0;i<n;i++){
          var p={type:fx};
          if(fx==='snow'||fx==='snow_light'){
            p.x=Math.random()*canvas.width;p.y=Math.random()*canvas.height;
            p.r=Math.random()*3.5+1;p.speed=Math.random()*1.2+0.4;
            p.wind=(Math.random()-0.5)*0.5;p.op=Math.random()*0.5+(fx==='snow_light'?0.15:0.3);
          }else if(fx==='rain'){
            p.x=Math.random()*canvas.width;p.y=Math.random()*canvas.height;
            p.len=Math.random()*15+8;p.speed=Math.random()*8+10;p.op=Math.random()*0.3+0.15;
          }else if(fx==='hearts'){
            p.x=Math.random()*canvas.width;p.y=canvas.height+Math.random()*canvas.height;
            p.size=Math.random()*16+8;p.speed=Math.random()*1+0.4;
            p.wind=(Math.random()-0.5)*0.4;p.op=Math.random()*0.5+0.3;
            p.wob=Math.random()*Math.PI*2;p.wsp=(Math.random()-0.5)*0.05;
          }else if(fx==='confetti'){
            var cc=FX_COLORS.confetti;
            p.x=Math.random()*canvas.width;p.y=Math.random()*canvas.height;
            p.w=Math.random()*8+4;p.h=Math.random()*4+2;
            p.col=cc[Math.floor(Math.random()*cc.length)];
            p.speed=Math.random()*2+0.5;p.wind=(Math.random()-0.5)*1;
            p.rot=Math.random()*Math.PI*2;p.rsp=(Math.random()-0.5)*0.1;p.op=Math.random()*0.6+0.4;
          }else if(fx==='bats'){
            p.x=Math.random()*canvas.width;p.y=Math.random()*canvas.height;
            p.size=Math.random()*14+8;p.sx=(Math.random()-0.5)*2.5;p.sy=(Math.random()-0.5)*1.5;
            p.fa=Math.random()*Math.PI*2;p.fs=Math.random()*0.15+0.08;p.op=Math.random()*0.5+0.3;
          }else if(fx==='candles'){
            p.x=Math.random()*canvas.width;p.y=Math.random()*canvas.height;
            p.size=Math.random()*4+2;p.speed=-(Math.random()*0.8+0.3);
            p.wind=(Math.random()-0.5)*0.3;p.op=Math.random()*0.5+0.3;p.life=Math.random();
          }else if(fx==='sunrays'){
            p.x=Math.random()*canvas.width;p.y=Math.random()*canvas.height;
            p.r=Math.random()*4+1;p.speed=Math.random()*0.8+0.2;
            p.wind=(Math.random()-0.5)*0.3;p.op=Math.random()*0.25+0.1;
          }else if(fx==='fireworks'){
            var fc=FX_COLORS.fireworks;
            p.x=Math.random()*canvas.width;p.y=Math.random()*canvas.height;
            p.r=Math.random()*2+0.5;p.sx=(Math.random()-0.5)*0.5;p.sy=(Math.random()-0.5)*0.5;
            p.life=Math.random();p.col=fc[Math.floor(Math.random()*fc.length)];p.op=Math.random();
          }
          particles.push(p);
        }
      }

      function drawHeart(x,y,sz){
        ctx.beginPath();
        ctx.moveTo(x,y-sz*0.1);
        ctx.bezierCurveTo(x,y-sz*0.5,x-sz*0.5,y-sz*0.5,x-sz*0.5,y-sz*0.25);
        ctx.bezierCurveTo(x-sz*0.5,y-sz*0.6,x,y-sz*0.5,x,y-sz*0.25);
        ctx.bezierCurveTo(x,y-sz*0.5,x+sz*0.5,y-sz*0.6,x+sz*0.5,y-sz*0.25);
        ctx.bezierCurveTo(x+sz*0.5,y-sz*0.5,x,y-sz*0.5,x,y-sz*0.1);
        ctx.closePath();
      }

      function animate(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(function(p){
          var fx=p.type;
          if(fx==='snow'||fx==='snow_light'){
            ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle='rgba(255,255,255,'+p.op+')';ctx.fill();
            p.y+=p.speed;p.x+=p.wind;
            if(p.y>canvas.height){p.y=-p.r;p.x=Math.random()*canvas.width;}
            if(p.x>canvas.width)p.x=0;if(p.x<0)p.x=canvas.width;
          }else if(fx==='rain'){
            ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-1,p.y+p.len);
            ctx.strokeStyle='rgba(150,200,255,'+p.op+')';ctx.lineWidth=1;ctx.stroke();
            p.y+=p.speed;p.x-=0.5;
            if(p.y>canvas.height){p.y=-p.len;p.x=Math.random()*canvas.width;}
            if(p.x<0)p.x=canvas.width;
          }else if(fx==='hearts'){
            ctx.save();ctx.globalAlpha=p.op;ctx.fillStyle='rgba(255,80,120,1)';
            drawHeart(p.x,p.y,p.size);ctx.fill();ctx.restore();
            p.y-=p.speed;p.wob+=p.wsp;p.x+=Math.sin(p.wob)*0.5+p.wind;
            if(p.y<-p.size){p.y=canvas.height+p.size;p.x=Math.random()*canvas.width;}
          }else if(fx==='confetti'){
            ctx.save();ctx.globalAlpha=p.op;ctx.fillStyle='rgb('+p.col+')';
            ctx.translate(p.x,p.y);ctx.rotate(p.rot);
            ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
            p.y+=p.speed;p.x+=p.wind;p.rot+=p.rsp;
            if(p.y>canvas.height){p.y=-10;p.x=Math.random()*canvas.width;}
          }else if(fx==='bats'){
            p.fa+=p.fs;
            var fy=Math.sin(p.fa)*p.size*0.5;
            ctx.save();ctx.globalAlpha=p.op;ctx.fillStyle='#2a1000';
            ctx.beginPath();ctx.ellipse(p.x,p.y,p.size*0.25,p.size*0.12,0,0,Math.PI*2);ctx.fill();
            ctx.beginPath();ctx.ellipse(p.x-p.size*0.45,p.y-fy,p.size*0.35,p.size*0.1,-0.3,0,Math.PI*2);ctx.fill();
            ctx.beginPath();ctx.ellipse(p.x+p.size*0.45,p.y-fy,p.size*0.35,p.size*0.1,0.3,0,Math.PI*2);ctx.fill();
            ctx.restore();
            p.x+=p.sx;p.y+=p.sy;
            if(p.x<-60)p.x=canvas.width+60;if(p.x>canvas.width+60)p.x=-60;
            if(p.y<-60)p.y=canvas.height+60;if(p.y>canvas.height+60)p.y=-60;
          }else if(fx==='candles'){
            p.life-=0.004;if(p.life<=0){p.life=1;p.x=Math.random()*canvas.width;p.y=canvas.height;}
            var alpha=Math.sin(p.life*Math.PI)*p.op;
            ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
            ctx.fillStyle='rgba(255,200,50,'+alpha+')';ctx.fill();
            p.y+=p.speed;p.x+=p.wind;
          }else if(fx==='sunrays'){
            ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle='rgba(255,180,0,'+p.op+')';ctx.fill();
            p.y-=p.speed;p.x+=p.wind;
            if(p.y<0){p.y=canvas.height;p.x=Math.random()*canvas.width;}
          }else if(fx==='fireworks'){
            p.life+=0.018;if(p.life>1){p.life=0;p.x=Math.random()*canvas.width;p.y=Math.random()*canvas.height;}
            var a=Math.sin(p.life*Math.PI)*p.op;
            ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle='rgb('+p.col+')';ctx.fill();ctx.restore();
            p.x+=p.sx;p.y+=p.sy;
          }
        });
        animId=requestAnimationFrame(animate);
      }

      function showSeason(){
        if(active)return;
        active=true;
        document.body.style.background=cfg.bg;
        canvas.style.display='block';
        initParticles();
        animate();
        if(cfg.lights){
          document.getElementById('ipas-wire').style.display='block';
          var ld=document.getElementById('ipas-lights');
          ld.style.display='flex';
          if(!ld.children.length){
            var nb=Math.floor(window.innerWidth/38);
            for(var i=0;i<nb;i++){
              var b=document.createElement('div');
              b.className='ipas-bulb';
              ld.appendChild(b);
            }
          }
        }
      }

      function hideSeason(){
        if(!active)return;
        active=false;
        document.body.style.background='';
        canvas.style.display='none';
        if(animId){cancelAnimationFrame(animId);animId=null;}
        document.getElementById('ipas-wire').style.display='none';
        document.getElementById('ipas-lights').style.display='none';
      }

      function checkPage(){
        var isLogin=!document.querySelector('[data-page="main"]')&&
                    (document.querySelector('input[type="password"]')!==null)&&
                    (document.querySelector('button[type="submit"]')!==null||document.querySelector('button')!==null);
        if(isLogin) showSeason(); else hideSeason();
      }

      var observer=new MutationObserver(function(){checkPage();});
      observer.observe(document.body,{childList:true,subtree:true});
      setTimeout(checkPage,500);
    })();
    </script>
  </body>
